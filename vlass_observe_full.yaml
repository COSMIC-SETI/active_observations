common:
  xengine_dynamic_spec:
    tuning_inclusions: ["AC", "BD"]

  antenna: &default_antenna
    number: 32
    # include: ["ea10"]
    criterion_minimum: 14
  duration_seconds: 300
  # intra_scan_repetition_backoff_period: 60
  observation_criteria:
    META.baseband.0: AC_8BIT
    META.baseband.1: BD_8BIT
    META.station.len>=: 14
    META.intents.ScanIntent: .*OBSERVE_TARGET.*
    META.scanid: (VLASS).*
    META.tend_unix.-now>: 15
    # META.fcents.0.>=: 2000
    #META.fcents.0.<=: 8000
    # META.fcents.1.>=: 2000
    #META.fcents.1.<=: 8000
    GPU_calibrationSubbandGrades.dataset_id.=.redis_value: META.datasetid
    CAL_fixedValuePaths.using_default_delays: "False"
  record_criteria:
    META_flagAnt.on_source.includesAntenna: *default_antenna
    META.tend_unix.-now>: 15
  compensations:
    delays: full-corrected-phase
    fiber_timestamp_shift: false
    lo_fshift: true

  hashpipe_keys:
    PROJID: vlass_target
  postprocess: vlass-seti

  recording_mode: raw
  repetitions: inf
