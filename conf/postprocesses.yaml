calibrate-raw:
  "#CONTEXT": "hpdaq"
  "#WORKERGROUP": "analysis"
  "#STAGES": "raw_calibrate"
  RawCalibrationENV: ""
  RawCalibrationARG: "--reference-antenna ea23 -f 256 -b 0.0625 -bc 0.5 -i 1 -td --pipeline -o /mnt/cosmic-storage-3/cosmicfs13/$PROJID$/$DATASET$/$OBSID$/raw_calibration/ -l /home/cosmic/conf/telinfo_vla.toml"
  RawCalibrationINP: "*hpdaq"
calibrate-raw-2.0:
  "#CONTEXT": "hpdaq"
  "#WORKERGROUP": "analysis"
  "#STAGES": "blri_pycorr uvh5_calibrate mv"
  BlriPycorrENV: ""
  BlriPycorrARG: "-sp 0.0625 -sc 0.5 -u 256 -i 1 --output-filepath $DATADIR$/raw_calibration/$OBSSTEM$.uvh5 -t /home/cosmic/conf/telinfo_vla.toml"
  BlriPycorrINP: "*hpdaq"
  UVH5CalibrateENV: ""
  UVH5CalibrateARG: "-o /mnt/cosmic-storage-3/cosmicfs13/$PROJID$/$DATASET$/$OBSID$/calibration/ --gengain --pub-to-redis --flagrfi"
  UVH5CalibrateINP: "blri_pycorr"
  MoveARG: "--path-local-to-storage-database /$PROJID$/$DATASET$/$OBSID$"
  MoveINP: "blri_pycorr"
analyse:
  "#CONTEXT": "hpdaq"
  "#WORKERGROUP": "analysis"
  "#STAGES": "vla_analyse"
  CorrelationAnalysisENV: ""
  CorrelationAnalysisARG: "-f 128 -i 1 -td -b 0.0625 -bc 0.5 -o /mnt/cosmic-storage-3/cosmicfs13/vla_analysis_plots/$OBSSTEM$/$inst$/ -l /home/cosmic/conf/telinfo_vla.toml"
  CorrelationAnalysisINP: "*hpdaq"
analyse-collate:
  "#CONTEXT": "hpdaq"
  "#WORKERGROUP": "analysis"
  "#STAGES": "vla_analyse collate_delays"
  CorrelationAnalysisENV: ""
  CorrelationAnalysisARG: "-f 128 -i 1 -td -b 0.0625 -bc 0.5 -r ea10 -o /mnt/cosmic-storage-3/cosmicfs13/vla_analysis_plots/$OBSSTEM$/$inst$/ -l /home/cosmic/conf/telinfo_vla.toml"
  CorrelationAnalysisINP: "*hpdaq"
  CollateDelaysARG: "-b $inst$ -r ea10 -c /mnt/slow/cosmic_delays_collation/"
  CollateDelaysINP: "vla_analyse"
analyse-remove:
  "#CONTEXT": "hpdaq"
  "#WORKERGROUP": "analysis"
  "#STAGES": "vla_analyse rm"
  CorrelationAnalysisENV: ""
  CorrelationAnalysisARG: "-f 128 -i 1 -td -b 0.0625 -bc 0.5 -o /mnt/cosmic-storage-3/cosmicfs13/vla_analysis_plots/$OBSSTEM$/$inst$/ -l /home/cosmic/conf/telinfo_vla.toml"
  CorrelationAnalysisINP: "*hpdaq"
  RemovalARG: "--dir-if-empty"
  RemovalINP: "*hpdaq"
calibrate-uvh5:
  "#CONTEXT": "hpdaq"
  "#WORKERGROUP": "analysis"
  "#STAGES": "uvh5_calibrate mv"
  UVH5CalibrateENV: ""
  UVH5CalibrateARG: "-o $DATADIR$/uvh5_calib_temp/ --gengain --pub-to-redis --flagrfi --calc-gain-grade"
  # UVH5CalibrateARG: "--gengain --pub-to-redis --flagrfi --calc-gain-grade"
  UVH5CalibrateINP: "*hpdaq"
  MoveARG: "--path-local-to-storage-database /$PROJID$/$DATASET$/$OBSID$/"
  MoveINP: "^uvh5_calibrate *uvh5_calibrate"
  # RemovalARG: "--dir-if-empty"
  # RemovalINP: "*uvh5_calibrate"
skip:
  "#STAGES": "skip"
remove:
  "#CONTEXT": "hpdaq"
  "#STAGES": "rm"
  RemovalARG: "--dir-if-empty"
  RemovalINP: "*hpdaq"
move-raw-to-storage:
  "#CONTEXT": "hpdaq_rawpart"
  "#CONTEXTENV": "BATCH_RAWPART_COUNT=4 POSTPROC_REMOVE_FAILURES=false DELETE_FINAL_BATCH=false"
  "#STAGES": "mv"
  MoveARG: "--path-local-to-storage-database /$PROJID$/$DATASET$/$OBSID$"
  MoveINP: "*hpdaq_rawpart"
vlass-seti:
  "#CONTEXT": "hpdaq_rawpart"
  "#CONTEXTENV": "BATCH_RAWPART_COUNT=1 DELETE_FINAL_BATCH=true"
  "#STAGES": "bfr5_generate beamform_search dbarchive rm"
  BFR5GenerateENV: ""
  BFR5GenerateARG: "--telescope-info-toml-filepath /home/cosmic/conf/telinfo_vla.toml --targets-redis-key-prefix targets:VLA-COSMIC:vlass_array --take-targets 5 -vvv"
  BFR5GenerateINP: "hpdaq_rawpart"
  BeamformSearchENV: "PATH=$PATH:/home/cosmic/src/blade/install/bin LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/home/cosmic/src/blade/install/lib/:/home/cosmic/src/blade/install/lib/x86_64-linux-gnu"
  BeamformSearchARG: "-c 131072 -C 1 -T 64 -N 1 --gpu-shares 2 --gpu-share-index $inst$ --gpu-target-most-memory --snr-threshold 8.0 --drift-rate-zero-excluded --drift-rate-maximum 20.0 --log-blade-output"
  BeamformSearchINP: "hpdaq_rawpart bfr5_generate"
  RemovalARG: ""
  RemovalINP: "hpdaq_rawpart"
  DBArchiveENV: "STAGE_TIMES=$times$ STAGE_NAMES=$stages$"
  DBArchiveARG: "-d /$PROJID$/$DATASET$/$OBSID$"
  DBArchiveINP: "bfr5_generate *beamform_search"
