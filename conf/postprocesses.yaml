  BeamformSearchARG: "-c 524288 -C 1 -T 4 -N 1 --search-exclusion-subband /home/cosmic/conf/rfi_subband_excision_crickets.csv --gpu-shares 2 --gpu-share-index $inst$ --gpu-target-most-memory --snr-threshold 8.0 --drift-rate-maximum 20.0 --log-blade-output"
  BeamformSearchINP: "*hpdaq_rawpart bfr5_generate"
